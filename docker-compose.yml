version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_sql_postgres
    restart: always
    environment:
      POSTGRES_DB: ai_sql_db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: admin_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d ai_sql_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ai_sql_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_ENGINE=postgresql
      - DATABASE_URL=postgresql://read_only_user:read_only_pass@postgres:5432/ai_sql_db
      - LLM_PROVIDER=mock
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
